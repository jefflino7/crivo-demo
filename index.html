<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crivo · Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Crivo — mesa de conferência clara: barra lateral azul-marinho com o monograma, área de trabalho em papel frio, severidade sempre como faixa colorida */
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --line:#e3e6ee; --line-2:#d2d7e3; --hover:#f0f1f7; --sel:#ecebfd;
  --text:#18203a; --mute:#647092; --mute-2:#8a94b0;
  --accent:#5b4bdb; --accent-hover:#4c3dc8; --accent-ink:#4a3cc4; --accent-soft:#eeecfd; --on-accent:#ffffff;
  --crit:#d92d47; --warn:#b86e00; --ok:#0f8a5f; --info:#2f63d8;
  --crit-bg:#fdecef; --warn-bg:#fff4e0; --ok-bg:#e5f6ee; --info-bg:#e8effd;
  --crit-line:#f3b7c1; --warn-line:#f2d29b; --ok-line:#a9dfc7;
  --shadow:0 1px 2px rgba(24,32,58,.06),0 2px 8px rgba(24,32,58,.05);
  --shadow-lift:0 6px 22px rgba(24,32,58,.12);
  --side-bg:#121a33; --side-text:#b9c1da; --side-hover:#1b2445; --side-on:#232d55; --side-line:#222c4c; --side-mute:#6a7598;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --bg:#0b1020; --surface:#141d35; --surface-2:#0f1630; --line:#232f4f; --line-2:#33406a; --hover:#18213e; --sel:#1f2750;
  --text:#e7ebf6; --mute:#8d97b5; --mute-2:#66708f;
  --accent:#8a7cf5; --accent-hover:#9b8ffa; --accent-ink:#c9c1ff; --accent-soft:#221f4a; --on-accent:#120d33;
  --crit:#ff5d6e; --warn:#f4b544; --ok:#37d39a; --info:#7aa6ff;
  --crit-bg:rgba(255,93,110,.12); --warn-bg:rgba(244,181,68,.12); --ok-bg:rgba(55,211,154,.12); --info-bg:rgba(122,166,255,.12);
  --crit-line:rgba(255,93,110,.45); --warn-line:rgba(244,181,68,.4); --ok-line:rgba(55,211,154,.4);
  --shadow:none; --shadow-lift:0 6px 22px rgba(0,0,0,.35);
  --side-bg:#10172b; --side-hover:#18213d; --side-on:#1c2547; --side-line:#232f4f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono,td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em}
h2{font-size:16px}
h3{font-size:14px}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.app.collapsed{grid-template-columns:72px 1fr}

/* barra lateral (sempre azul-marinho) */
.side{background:var(--side-bg);color:#e9ecf7;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px}
.mono-jl{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #6c62c9;display:grid;place-items:center;font-family:var(--display);font-size:16px;letter-spacing:.02em;color:#e9e5ff;background:#151c36;box-shadow:inset 0 0 0 3px #10172b,inset 0 0 0 4px #3a3478}
.brand b{display:block;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1;color:#fff}
.brand small{display:block;color:#8e98b8;font-size:11.5px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;overflow:auto;flex:1}
.nav .sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--side-text);text-decoration:none;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.on{background:var(--side-on);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#8a7cf5}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;background:rgba(255,93,110,.18);color:#ff8a97;font:600 11px var(--mono);padding:1px 7px;border-radius:20px;font-style:normal}
.me{border-top:1px solid var(--side-line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#262f55;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#dcd6ff}
.me .who{min-width:0;flex:1}.me .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.me .who span{font-size:11.5px;color:#8e98b8}
.sidebtn{background:none;border:0;color:#8e98b8;cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
.sidebtn:hover{background:var(--side-hover);color:#fff}
.sidebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app.collapsed .brand>div,.app.collapsed .nav .sec,.app.collapsed .nav a span,.app.collapsed .nav .badge,.app.collapsed .me .who,.app.collapsed #btnTema{display:none}
.app.collapsed .brand,.app.collapsed .me{justify-content:center;padding-left:0;padding-right:0}
.app.collapsed .nav a{justify-content:center}

/* área principal */
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top .crumb{color:var(--mute);font-size:13px}
.top .crumb b{color:var(--text);font-weight:500}
.top .sp{flex:1}
.kbd{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)}
.hamb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.view{padding:24px 28px 60px;overflow:auto;flex:1;min-height:0}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:entra .25s ease-out}
@keyframes entra{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;color:var(--mute);font-size:13px}
.banner.warn{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.banner.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok)}

/* controles */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover);box-shadow:var(--shadow-lift)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--mute);font-size:13px;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.seg .c{font:600 11px var(--mono);padding:0 6px;border-radius:10px;background:var(--hover)}
.seg .c.crit{background:var(--crit-bg);color:var(--crit)}.seg .c.warn{background:var(--warn-bg);color:var(--warn)}.seg .c.info{background:var(--info-bg);color:var(--info)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:10px;background:var(--line-2);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{transform:translateX(14px)}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card>header .sp{flex:1}
.card .body{padding:16px 18px}
.muted{color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
button.tile{cursor:pointer}
button.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
button.tile.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile .l{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.tile .l .go{opacity:0;transition:opacity .15s;color:var(--accent-ink)}
button.tile:hover .l .go{opacity:1}
.tile .v{font:600 30px/1.1 var(--mono);margin-top:8px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--mute);margin-top:4px}
.tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.tile.crit::after{background:var(--crit)}.tile.warn::after{background:var(--warn)}.tile.ok::after{background:var(--ok)}
.tile.crit .v{color:var(--crit)}.tile.warn .v{color:var(--warn)}.tile.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

/* barra de progresso */
.prog{display:flex;flex-direction:column;gap:6px;width:320px;max-width:100%}
.prog .t span+span{text-align:right}
.prog .t{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.prog .t b{color:var(--text);font-family:var(--mono)}
.prog .track{height:8px;border-radius:6px;background:var(--hover);overflow:hidden;display:flex}
.prog .track i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog .track i.ok{background:var(--ok)}.prog .track i.warn{background:var(--warn)}.prog .track i.crit{background:var(--crit)}

/* tabelas */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:500;color:var(--mute);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
th.sort{cursor:pointer;user-select:none}th.sort:hover{color:var(--text)}
th.sort .ar{opacity:.4;margin-left:4px}th.sort.on .ar{opacity:1;color:var(--accent-ink)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover td{background:var(--hover)}
tr.click:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.n,th.n{text-align:right}
.bad{color:var(--crit)}.good{color:var(--ok)}.wn{color:var(--warn)}
tr.diverge td{background:color-mix(in srgb,var(--crit-bg) 55%,transparent)}

/* etiquetas */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.neutral{background:var(--hover);color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.chip i.no{background:var(--line-2)}.chip i.crit{background:var(--crit)}.chip i.ok{background:var(--ok)}.chip i.ac{background:var(--accent)}

/* barras */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:6px 8px;margin:0 -8px;border-radius:8px;transition:background .12s}
.bar:hover{background:var(--hover)}
.bar .t{display:flex;flex-direction:column;gap:5px;min-width:0}
.bar .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:6px;border-radius:4px;background:var(--hover);overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:cresce .7s cubic-bezier(.2,.8,.2,1)}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar .fill.crit{background:var(--crit)}.bar .fill.warn{background:var(--warn)}
.bar b{font:600 13px var(--mono);text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}

/* cabeçalho do processo */
.phead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px}
.phead .id{flex:1;min-width:260px}
.phead .ref{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
.phead h1{margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:12.5px;margin-top:8px}
.meta b{color:var(--text);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--mute);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.tabs button .c{font:600 11px var(--mono);margin-left:6px;padding:1px 6px;border-radius:10px;background:var(--hover)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .sp{flex:1}

/* apontamentos */
.finds{display:flex;flex-direction:column;gap:10px}
.find{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:0 var(--r) var(--r) 0;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s,opacity .2s}
.find:hover{box-shadow:var(--shadow-lift)}
.find.crit{border-left-color:var(--crit)}.find.warn{border-left-color:var(--warn)}.find.info{border-left-color:var(--info)}
.find.done{opacity:.7;border-left-color:var(--ok)}
.find.foco{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-lift)}
.find .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;cursor:pointer;user-select:none;border-radius:0 var(--r) var(--r) 0}
.find .hd:hover{background:var(--hover)}
.find .hd h3{font-size:14.5px;flex:1;min-width:200px}
.find .num{font:600 11.5px var(--mono);color:var(--mute);min-width:24px}
.find .grp{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.find .chev{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2;transition:transform .2s;flex:none}
.find.open .chev{transform:rotate(90deg)}
.find .bd{display:none;padding:0 16px 14px 16px;flex-direction:column;gap:10px}
.find.open .bd{display:flex;animation:entra .2s ease-out}
.find .resumo{padding:0 16px 12px 52px;margin-top:-4px;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find.open .resumo{display:none}
.find p{margin:0;color:var(--text);max-width:80ch}
.find .sug{font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:8px;padding:7px 10px;align-self:flex-start}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.val{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.val .k{font-size:11px;color:var(--mute)}
.val .v{font-family:var(--mono);font-size:13px;margin-top:2px;word-break:break-word}
.val.diff{border-color:var(--crit-line);background:var(--crit-bg)}
.val.diff .v{color:var(--crit);font-weight:500}
.val.miss .v{color:var(--warn)}
.find .ft{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.find .ft .who{font-size:12px;color:var(--mute);margin-left:auto}
.just{font-size:13px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:8px;padding:8px 10px}
.ia{font:600 10.5px var(--mono);color:var(--accent-ink);border:1px solid var(--accent);border-radius:4px;padding:1px 5px}
details summary{cursor:pointer;font-size:12.5px;color:var(--mute)}
details ul{margin:8px 0 0;padding-left:18px;font-family:var(--mono);font-size:12px}

/* envio de arquivos */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;background:var(--surface-2);cursor:pointer;display:block;transition:border-color .15s,background .15s,transform .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.over{transform:scale(1.01)}
.drop b{display:block;font-size:14.5px}
.drop span{font-size:12.5px;color:var(--mute)}
.drop svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.6;margin-bottom:6px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.file{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;animation:entra .2s ease-out}
.file .tag{font:600 10.5px var(--mono);padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.file .tag.no{background:var(--warn-bg);color:var(--warn)}
.file .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.file select{padding:5px 8px;font-size:12.5px}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

.mk.warn{border-color:#d08a12;background:rgba(244,181,68,.18)}

.empty{padding:28px;text-align:center;color:var(--mute)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}

.search{display:flex;gap:8px;flex-wrap:wrap}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Navegação"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view"></main>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const CRIVO_DEMO=true;
const PDFJS_WORKER_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
// ===== Leitura de PDF (pdf.js) e parsers do Sigraweb =====
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getPdfjs(){
  for(let i=0;i<120&&!window.pdfjsLib;i++) await sleep(100);
  const lib=window.pdfjsLib;
  if(!lib) throw new Error("O leitor de PDF não carregou. Recarregue a página.");
  try{ if(!lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER_URL; }catch(e){}
  return lib;
}
async function openPdf(bytes){
  const lib=await getPdfjs();
  return lib.getDocument({data:bytes.slice(0),isEvalSupported:false}).promise;
}
async function readPdf(bytes){
  const doc=await openPdf(bytes);
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const vp=pg.getViewport({scale:1});
    const tc=await pg.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width,h:Math.abs(i.transform[3])||i.height||8}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];
    for(const it of its){const L=lines.find(l=>Math.abs(l.y-it.y)<2.5); if(L)L.items.push(it); else lines.push({y:it.y,items:[it]});}
    lines.sort((a,b)=>b.y-a.y);
    for(const l of lines){
      l.items.sort((a,b)=>a.x-b.x);
      let t="",px=null;
      for(const i of l.items){ if(px!==null && i.x-px>1.5 && !t.endsWith(" ")) t+=" "; t+=i.s; px=i.x+i.w; }
      l.text=t.replace(/\s+/g," ").trim(); l.page=p-1; l.pairs=pairsOf(l.items,p-1);
      l.box=boxOf(l.items,p-1);
    }
    pages.push({w:vp.width,h:vp.height,lines});
  }
  return {numPages:doc.numPages,pages,text:pages.map(p=>p.lines.map(l=>l.text).join("\n")).join("\n\n")};
}
function boxOf(items,p){
  const x=Math.min(...items.map(i=>i.x)), y=Math.min(...items.map(i=>i.y-(i.h*0.22)));
  const x2=Math.max(...items.map(i=>i.x+i.w)), y2=Math.max(...items.map(i=>i.y+i.h*0.85));
  return {p,x:+x.toFixed(1),y:+y.toFixed(1),w:+(x2-x).toFixed(1),h:+(y2-y).toFixed(1)};
}
// Pares rótulo:valor de uma linha. Aceita "Rótulo" + ": valor", "Rótulo:" + "valor" e "Rótulo: valor".
function pairsOf(items,p){
  const t=items.filter(i=>i.s.trim()!=="|");
  const out=[];
  const isLabelAt=j=>{const u=t[j].s.trim(), un=t[j+1]?t[j+1].s.trim():"";
    return (u.endsWith(":")&&u.length>1)||(un.startsWith(":")&&!u.startsWith(":"))||/^[^:]{2,40}: /.test(u);};
  const collect=(j,first,label,boxItems)=>{
    const vals=first?[first]:[];
    while(j<t.length && !isLabelAt(j)){vals.push(t[j].s.trim());boxItems.push(t[j]);j++;}
    out.push({k:label,v:vals.join(" ").trim(),box:boxOf(boxItems,p)}); return j;
  };
  for(let i=0;i<t.length;i++){
    const s=t[i].s.trim(), nx=t[i+1]?t[i+1].s.trim():null;
    if(nx!==null && nx.startsWith(":") && !s.endsWith(":") && !s.startsWith(":")){
      i=collect(i+2,nx.slice(1).trim(),s,[t[i],t[i+1]])-1; continue;
    }
    if(s.endsWith(":") && s.length>1){
      i=collect(i+1,"",s.slice(0,-1).trim(),[t[i]])-1; continue;
    }
    const m=s.match(/^([^:]{2,50}?):\s*(.*)$/);
    if(m && !/^https?$/i.test(m[1])) out.push({k:m[1].trim(),v:m[2].trim(),box:boxOf([t[i]],p)});
  }
  return out;
}
const numBR=s=>{
  if(s==null) return null; s=String(s).trim(); if(!s) return null;
  const m=s.match(/-?\d[\d.]*,\d+|-?\d+(?:\.\d{3})+|-?\d+/); if(!m) return null;
  let v=m[0]; if(v.includes(",")) v=v.replace(/\./g,"").replace(",","."); else if(/\.\d{3}$/.test(v)&&v.split(".").length>1) v=v.replace(/\./g,"");
  const n=parseFloat(v); return isNaN(n)?null:n;
};
function classifyText(text){
  const t=text.slice(0,4000);
  if(/Conferência DUIMP\s*\|\s*Sigraweb/i.test(t)) return "SIGRA_DUIMP";
  if(/Conferência do Processo Detalhado/i.test(t)) return "SIGRA_DET";
  if(/Conferência do Processo Simplificad|Conferência Simplificada/i.test(t)) return "SIGRA_SIMP";
  if(/certificate of origin|certificado de origem|certificado de origen|statement on origin|declaração de origem/i.test(t)) return "CO";
  if(/bill of lading|conhecimento de embarque|sea ?waybill|air ?waybill|\bB\/L\b/i.test(t)) return "BL";
  if(/packing list|romaneio|lista de embalagem/i.test(t)) return "PL";
  if(/commercial invoice|\binvoice\b|fatura comercial|factura/i.test(t)) return "INV";
  return null;
}
const isNoise=t=>/^\d{2}\/\d{2}\/\d{4}, \d{2}:\d{2}/.test(t)||/^https:\/\/app\.sigraweb/.test(t);

// ---- Conferência DUIMP (Sigraweb)
function parseSigraDuimp(pdf){
  const S={fonte:"Conferência DUIMP",header:{},loc:{},docsInstr:[],embalagens:[],embalagemNenhuma:false,fatura:{},fornecedor:{},itens:[],totais:{}};
  const lines=pdf.pages.flatMap(p=>p.lines).filter(l=>!isNoise(l.text));
  let mode="header",cur=null,sub=null,desc=false,inEmb=false,inForn=false,fatItens=[],lastCodLine=false,afterIncoterms=false;
  const setH=(k,v,box)=>{ if(!(k in S.header)){S.header[k]=v; S.loc[k]=box;} };
  const newItem=(seq,box)=>{cur={seq,loc:{item:box},exportador:{},fabricante:{}};sub=null;desc=false;return cur;};
  for(const l of lines){
    const t=l.text;
    let m;
    if((m=t.match(/^Item DUIMP (\d+)/))){mode="item";S.itens.push(newItem(+m[1],l.box));continue;}
    if(mode==="header" && /^Itens \(\d+\)/.test(t)){mode="fat";continue;}
    if(mode==="header"){
      if(/^Item Carga Tipo/.test(t)){inEmb=true;S.loc.embalagem=l.box;continue;}
      if(inEmb){ if(/^Documentos de Instrução/.test(t)){inEmb=false;} else { if(/Nenhuma embalagem/.test(t)) S.embalagemNenhuma=true; else S.embalagens.push(t); continue; } }
      if((m=t.match(/(?:^|\s)(\d{14})(?:\s|$)/)) && !S.header.cnpj) S.header.cnpj=m[1];
      if((m=t.match(/^(FATURA COMERCIAL|ROMANEIO DE CARGA|CONHECIMENTO DE CARGA|CERTIFICADO DE ORIGEM|PACKING LIST|[A-ZÇÃÁÉÍÓÕÚ ]{5,40}): (\S+)/)) && !/^(CE|URF|FOB)$/.test(m[1])) S.docsInstr.push({tipo:m[1].trim(),num:m[2],box:l.box});
      if((m=t.match(/^FOB ([\d.,]+) ([\d.,]+)$/))){S.totais.fob=numBR(m[1]);S.loc.totais=l.box;}
      if((m=t.match(/^Frete ([\d.,]+) ([\d.,]+)$/))) S.totais.frete=numBR(m[1]);
      if((m=t.match(/^Seguro.*?([\d.,]+) ([\d.,]+)$/))) S.totais.seguro=numBR(m[1]);
      if((m=t.match(/Valor Aduaneiro \(USD\): ([\d.,]+)/))) S.totais.vaUSD=numBR(m[1]);
      if((m=t.match(/Taxa do Dólar: ([\d.,]+)/))) S.totais.taxa=numBR(m[1]);
      if((m=t.match(/Valor Aduaneiro \(estimado\): ([\d.,]+)/))) S.totais.vaEstimado=numBR(m[1]);
      if((m=t.match(/^Fatura (\S+)$/))){S.fatura.num=m[1];S.loc.fatura=l.box;continue;}
      if(/^Dados do Fornecedor/.test(t)){inForn=true;continue;}
      if(S.fatura.num && afterIncoterms && S.fatura.valor==null && (m=t.match(/([\d.]+,\d+) ([\d.]+,\d+)$/))){S.fatura.pesoLiq=numBR(m[1]);S.fatura.valor=numBR(m[2]);afterIncoterms=false;}
      for(const pr of l.pairs){
        if(S.fatura.num && pr.k==="Incoterms"){S.fatura.incoterm=pr.v;S.loc.incoterm=pr.box;afterIncoterms=true;continue;}
        if(S.fatura.num && pr.k==="Moeda"){S.fatura.moeda=pr.v;S.loc.moeda=pr.box;continue;}
        if(inForn && pr.k==="Nome"){S.fornecedor.nome=pr.v;continue;}
        if(inForn && pr.k==="País"){S.fornecedor.pais=pr.v;continue;}
        setH(pr.k,pr.v,pr.box);
      }
      continue;
    }
    // itens (fatura ou DUIMP)
    if(mode==="fat"){ const ncm=l.pairs.find(p=>p.k==="NCM"); if(ncm){fatItens.push(newItem(fatItens.length+1,l.box));} if(!cur) continue; }
    if(!cur) continue;
    if(/^Dados do Exportador/.test(t)){sub="exp";desc=false;continue;}
    if(/^Dados do Fabricante/.test(t)){sub="fab";desc=false;continue;}
    if(/IMPOSTO DE IMPORTAÇÃO/.test(t) && (m=t.match(/Fundamento (\S+)\s+(.*?)(?:\s+·\s+Regime.*)?$/))){cur.fundII={cod:m[1],desc:m[2].trim()};cur.loc.fundII=l.box;continue;}
    if(/Nenhuma LPCO/.test(t)) cur.lpco="Nenhuma";
    const prs=l.pairs;
    if(desc){
      if(/^(Quantidade|Descrição Complementar|Valor unitário|Unidade|Caracterização|Atributos)\b/.test(t)) desc=false;
      else {cur.desc+=" "+t; continue;}
    }
    if(lastCodLine && !prs.length && /^[\w./-]{1,20}$/.test(t)){cur.codInterno=(cur.codInterno||"")+" "+t;lastCodLine=false;continue;}
    lastCodLine=false;
    if(!prs.length && !cur.nomeProduto && cur.codProduto && !cur.desc && !/^(Caracteriza|\(|Atributos|Sem atributos|Nenhum)/.test(t)){cur.nomeProduto=t;continue;}
    for(const pr of prs){
      const k=pr.k,v=pr.v;
      if(k==="NCM"){cur.ncm=v.replace(/\D/g,"");cur.loc.ncm=pr.box;}
      else if(k==="Código Interno"){ if(!sub){cur.codInterno=v;lastCodLine=true;} }
      else if(k==="Código do Produto"){ if(!sub) cur.codProduto=v; }
      else if(k==="Descrição"){cur.desc=v;desc=true;cur.loc.desc=pr.box;}
      else if(k==="Quantidade"){cur.qtd=numBR(v);cur.loc.qtd=pr.box;}
      else if(k==="Valor unitário"){cur.vunit=numBR(v);}
      else if(k==="Valor total"){cur.valor=numBR(v);cur.loc.valor=pr.box;}
      else if(k==="Unidade"){cur.unidade=v;}
      else if(k==="Peso líquido"){cur.pesoLiq=numBR(v);cur.loc.peso=pr.box;}
      else if(k==="Nome" && sub==="exp"){cur.exportador.nome=v;}
      else if(k==="País" && sub==="exp"){cur.exportador.pais=v;}
      else if(k==="Nome"){cur.fabricante.nome=v;cur.loc.fab=pr.box;}
      else if(k==="País"){cur.fabricante.pais=v;cur.loc.origem=pr.box;}
      else if(k==="Condição de Venda (Incoterms)"){cur.incoterm=v;}
      else if(k==="Cobertura cambial"){cur.cobertura=v;}
      else if(k==="Alíquota ICMS (Normal)"){cur.icms=numBR(v);cur.loc.icms=pr.box;}
      else if(k==="FECP/FCP"){cur.fcp=numBR(v);}
      else if(k==="Método de Valoração Aduaneira"){cur.metodo=v;}
      else if(k==="Tipo de Vínculo entre Exportador e Importador"){cur.vinculo=v;}
      else if(k==="Vínculo Exportador/Fabricante"){cur.vincFab=v;}
      else if(k==="Condição da mercadoria"){cur.condicao=v;}
      else if(k==="Aplicação"){cur.aplicacao=v;}

  let emp=H["Empresa"]||"";
  const eLine=lines.findIndex(l=>l.pairs.some(pr=>pr.k==="Empresa"));
  if(eLine>=0&&lines[eLine+1]){const m2=lines[eLine+1].text.match(/^(.*?)\s*-\s*\d{14}$/);if(m2)emp+=" "+m2[1];}
  S.empresa=(emp.includes(" - ")?emp.slice(emp.indexOf(" - ")+3):emp).trim();
  S.docCarga=H["Doc Carga"]||null; S.dataEmbarque=H["Data de embarque"]||null; S.ce=H["CE"]||null;
  S.procedencia=H["Procedência"]||null; S.pesoBruto=numBR(H["Peso bruto"]); S.pesoLiq=numBR(H["Peso líquido"]);

}

// ---- Conferência Detalhada (Sigraweb)
function parseSigraDet(pdf){
  const D={fonte:"Conferência Detalhada",header:{},loc:{},adicoes:[]};
  const lines=pdf.pages.flatMap(p=>p.lines).filter(l=>!isNoise(l.text));
  let cur=null;
  for(const l of lines){
    for(const pr of l.pairs){
      if(pr.k==="Informações da Adição Nº"){cur={n:+pr.v,loc:{ad:l.box}};D.adicoes.push(cur);continue;}
      if(!cur){ if(!(pr.k in D.header)){D.header[pr.k]=pr.v;D.loc[pr.k]=pr.box;} continue; }
      const k=pr.k,v=pr.v;
      if(k==="NR NCM") cur.ncm=v.replace(/\D/g,"");
      else if(k==="Peso Líquido" && cur.pesoLiq==null) cur.pesoLiq=numBR(v);
      else if(k==="Valor FOB") {cur.fob=numBR(v);cur.loc.fob=pr.box;}
      else if(k==="Valor Frete") {cur.frete=numBR(v);cur.loc.frete=pr.box;}
      else if(k==="Valor Seguro") cur.seguro=numBR(v);
      else if(k==="País Origem") cur.origem=v;
      else if(k==="Fabricante" && cur.fab==null) cur.fab=v;
      else if(k==="Fund. Legal II") cur.fundII=v;
      else if(k==="Incoterms") cur.incoterm=v;
      else if(k==="Fornecedor") cur.fornecedor=v;
    }
  }
  const H=D.header;
  D.cnpj=(H["CNPJ"]||"").replace(/\D/g,"")||null; D.ref=H["Identificação"]||null;
  D.procedencia=H["País de Procedência"]||null; D.pesoBruto=numBR(H["Peso Bruto"]); D.pesoLiq=numBR(H["Peso Líquido"]);
  D.volumes=numBR(H["Volumes"]); D.embalagem=H["Embalagem"]||null; D.docCarga=H["IDT. Conhecimento"]||null;
  D.dataEmbarque=H["Data de Embarque"]||null;
  return D;
}

function pais(s){
  if(!s) return null; let k=deacc(String(s).replace(/^\d+\s*/,"").replace(/[()]/g," ").trim());
  if(PAISES[k]) return PAISES[k];
  for(const [a,b] of Object.entries(PAISES)) if(k===a||k.startsWith(a+" ")||k.endsWith(" "+a)) return b;
  return String(s).replace(/^\d+\s*/,"").trim()||null;
}
const fmt=(n,d=2)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtKg=n=>n==null?"—":fmt(n,n%1?3:0)+" kg";
const eq=(a,b,tol)=>a!=null&&b!=null&&Math.abs(a-b)<=tol+1e-9;
const blank=v=>v==null||v===""||(typeof v==="number"&&isNaN(v));
const digits=s=>String(s||"").replace(/\D/g,"");
const normId=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const incoBase=s=>{const m=String(s||"").toUpperCase().match(/\b(EXW|FCA|FAS|FOB|CFR|CIF|CPT|CIP|DAP|DPU|DAT|DDP|C&F|CNF)\b/);return m?m[1].replace(/C&F|CNF/,"CFR"):null;};
const moedaBase=s=>{const t=deacc(s);if(!t)return null;if(/usd|dolar|\$/.test(t))return"USD";if(/eur|euro/.test(t))return"EUR";if(/brl|real/.test(t))return"BRL";if(/cny|rmb|yuan|renminbi/.test(t))return"CNY";if(/jpy|iene|yen/.test(t))return"JPY";if(/gbp|libra/.test(t))return"GBP";if(/sek|coroa sueca/.test(t))return"SEK";if(/chf|franco/.test(t))return"CHF";return String(s).toUpperCase().slice(0,3);};
function dims(s){
  const m=String(s||"").match(/(\d+(?:[.,]\d+)?)\s*(?:MM)?\s*[X×x*]\s*(\d+(?:[.,]\d+)?)\s*(?:MM)?\s*[X×x*]\s*(\d+(?:[.,]\d+)?)/);
  return m?[m[1],m[2],m[3]].map(v=>parseFloat(v.replace(/\.(?=\d{3}\b)/g,"").replace(",","."))):null;
}
const sameDims=(a,b)=>{if(!a||!b)return true;const x=[...a].sort((p,q)=>p-q),y=[...b].sort((p,q)=>p-q);return x.every((v,i)=>Math.abs(v-y[i])<=Math.max(0.01,v*0.005));};
function rangeSeq(seqs){
  const s=[...new Set(seqs)].sort((a,b)=>a-b);const out=[];
  for(let i=0;i<s.length;i++){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;out.push(j>i?`${s[i]} a ${s[j]}`:`${s[i]}`);i=j;}
  return out.join(", ");
}

function conferir(proc,cfg){
  cfg=cfg||{};
  const niv=id=>(cfg.niveis&&cfg.niveis[id])||REGRA[id].nivel;
  const tolPeso=cfg.tolPeso??0, tolValor=cfg.tolValor??0.01;
  const docs=proc.docs||{}, BL=docs.BL||null, INV=docs.INV||null, PL=docs.PL||null, CO=docs.CO||null, G=proc.sigra||null;
  const A=[]; const add=(id,o)=>{A.push({id:o.key||id,regra:id,nivel:o.nivel||niv(id),grupo:REGRA[id].grupo,titulo:o.titulo||REGRA[id].titulo,descricao:o.descricao,valores:o.valores||null,linhas:o.linhas||null,sugestao:o.sugestao||null,locs:(o.locs||[]).filter(Boolean).slice(0,30),itens:o.itens||null,origem:o.origem||"regra"});};
  const L=k=>G&&G.loc?G.loc[k]:null;
  const V=(k,v,diff,miss)=>({k,v:v==null||v===""?"não informado":String(v),diff:!!diff,miss:v==null||v===""||!!miss});
  const ok=[];// verificações aprovadas (para o placar)
  const pass=(t)=>ok.push(t);
  if(!G){return {achados:A,ok,itens:[],resumo:{}}}

  // --- Importador
  const cnpjDoc=digits(INV?.importador?.cnpj)||digits(BL?.importador?.cnpj);
  if(cnpjDoc && G.cnpj){ if(cnpjDoc!==digits(G.cnpj)) add("cnpj",{descricao:"O CNPJ do importador nos documentos é diferente do CNPJ do processo.",valores:[V("Invoice",INV?.importador?.cnpj),V("BL",BL?.importador?.cnpj),V("Sigraweb",G.cnpj,true)],locs:[L("Empresa")]}); else pass("CNPJ do importador"); }
  const cnpjs=[INV,BL].map(d=>digits(d?.importador?.cnpj)).filter(Boolean);
  if(cnpjs.length===2&&cnpjs[0]!==cnpjs[1]) add("docs_entre_si",{key:"docs_cnpj",titulo:"CNPJ diferente entre BL e invoice",descricao:"O consignatário do BL não tem o mesmo CNPJ da invoice.",valores:[V("Invoice",INV.importador.cnpj),V("BL",BL.importador.cnpj,true)]});

  // --- Incoterm e moeda
  const incoS=incoBase(G.fatura?.incoterm||G.itens[0]?.incoterm), incoD=incoBase(INV?.incoterm)||incoBase(PL?.incoterm);
  if(incoD&&incoS){ if(incoD!==incoS) add("incoterm",{descricao:`A invoice está em ${incoD} e o processo está em ${incoS}.`,valores:[V("Invoice",INV?.incoterm),V("Packing",PL?.incoterm),V("Sigraweb",G.fatura?.incoterm,true)],locs:[L("incoterm")]}); else pass("Incoterm "+incoS); }
  else if(incoD&&!incoS) add("incoterm",{descricao:"O incoterm não está informado no processo.",valores:[V("Invoice",INV?.incoterm),V("Sigraweb",null)],locs:[L("incoterm")]});
  const moS=moedaBase(G.fatura?.moeda), moD=moedaBase(INV?.moeda);
  if(moS&&moD){ if(moS!==moD) add("moeda",{descricao:`A invoice está em ${moD} e o processo em ${moS}.`,valores:[V("Invoice",INV.moeda),V("Sigraweb",G.fatura.moeda,true)],locs:[L("moeda")]}); else pass("Moeda "+moS); }

  // --- Valores
  const somaItensS=G.itens.reduce((a,i)=>a+(i.valor||0),0);
  const vS=G.fatura?.valor??(somaItensS||null);
  if(INV?.valor_total!=null&&vS!=null){
    if(!eq(INV.valor_total,vS,tolValor)) add("valor_total",{descricao:`O valor total da fatura no processo difere da invoice em ${fmt(vS-INV.valor_total)} ${moD||""}.`,valores:[V("Invoice",fmt(INV.valor_total)),V("Sigraweb · fatura",fmt(vS),true),V("Sigraweb · soma dos itens",fmt(somaItensS),!eq(somaItensS,INV.valor_total,tolValor))],locs:[L("fatura")]});
    else if(somaItensS&&!eq(somaItensS,INV.valor_total,tolValor)) add("valor_total",{descricao:"A soma dos itens no processo não fecha com o total da invoice.",valores:[V("Invoice",fmt(INV.valor_total)),V("Soma dos itens",fmt(somaItensS),true)]});
    else pass("Valor total "+fmt(vS));
  }
  if(INV?.itens?.length&&INV.valor_total!=null){const si=INV.itens.reduce((a,i)=>a+(i.valor||0),0); if(si&&!eq(si,INV.valor_total,tolValor)) add("docs_entre_si",{key:"docs_inv_soma",titulo:"Invoice não fecha",descricao:"A soma dos itens da invoice é diferente do total declarado nela.",valores:[V("Soma dos itens",fmt(si),true),V("Total da invoice",fmt(INV.valor_total))]});}

  const isC=["CFR","CIF","CPT","CIP"].includes(incoS||incoD);
  const fobS=G.totais?.fob, freS=G.totais?.frete;
  const adFob=G.adicoes?G.adicoes.reduce((a,x)=>a+(x.fob||0),0):null, adFre=G.adicoes?G.adicoes.reduce((a,x)=>a+(x.frete||0),0):null;
  if(isC && INV){
    if(INV.frete!=null||INV.valor_fob!=null){
      const fobRef=INV.valor_fob, freRef=INV.frete;
      if((fobS===0||fobS==null)&&(freS===0||freS==null)&&somaItensS>0){
        add("totais_zerados",{descricao:"Os totais de FOB e frete do cabeçalho estão zerados, embora os itens tenham valor. Confira se o frete foi lançado no processo antes de registrar.",valores:[V("Invoice · FOB",fmt(fobRef)),V("Invoice · frete",fmt(freRef)),V("Sigraweb · FOB",fmt(fobS??0),true),V("Sigraweb · frete",fmt(freS??0),true)],locs:[L("totais")]});
      } else {
        const d1=fobRef!=null&&fobS!=null&&!eq(fobRef,fobS,tolValor), d2=freRef!=null&&freS!=null&&!eq(freRef,freS,tolValor);
        if(d1||d2) add("fob_frete",{descricao:"FOB ou frete do processo não batem com a invoice.",valores:[V("Invoice · FOB",fmt(fobRef)),V("Sigraweb · FOB",fmt(fobS),d1),V("Invoice · frete",fmt(freRef)),V("Sigraweb · frete",fmt(freS),d2)],locs:[L("totais")]}); else pass("FOB e frete do cabeçalho");
      }
      if(adFob!=null&&fobRef!=null){
        const d1=!eq(adFob,fobRef,tolValor), d2=freRef!=null&&!eq(adFre,freRef,tolValor);
        if(d1||d2) add("frete_rateio",{descricao:`A soma das ${G.adicoes.length} adições não fecha com a invoice (diferença de ${fmt(Math.abs(adFob-fobRef))} no FOB e ${fmt(Math.abs((adFre||0)-(freRef||0)))} no frete). Normalmente é arredondamento do rateio; ajuste a última adição para o total bater.`,valores:[V("Invoice · FOB",fmt(fobRef)),V("Adições · FOB",fmt(adFob),d1),V("Invoice · frete",fmt(freRef)),V("Adições · frete",fmt(adFre),d2)],locs:G.adicoes.slice(-1).map(a=>a.loc?.frete)});
        else pass("Rateio de FOB/frete nas adições");
      }
      if(fobRef!=null&&freRef!=null&&INV.valor_total!=null&&!eq(fobRef+freRef+(INV.seguro||0),INV.valor_total,tolValor)) add("docs_entre_si",{key:"docs_inv_cfr",titulo:"FOB + frete ≠ total da invoice",descricao:"Na própria invoice, FOB + frete (+ seguro) não fecha com o total.",valores:[V("FOB + frete",fmt(fobRef+freRef),true),V("Total",fmt(INV.valor_total))]});
    } else if(somaItensS>0) add("fob_frete",{nivel:"warn",descricao:`A condição é ${incoS||incoD}, mas a invoice não separa FOB e frete. Confirme o frete com o exportador antes de registrar.`,valores:[V("Invoice · frete",null)]});
    // frete do BL
    const fb=(BL?.fretes_bl||[]).filter(f=>f.valor!=null&&/ocean|freight|frete|bas|surch|bunker|efs|fuel|ets|etq|emission/i.test(f.descricao||"")&&f.modalidade!=="collect");
    if(fb.length&&INV.frete!=null){
      const porMoeda={};for(const f of fb){const m=moedaBase(f.moeda)||"?";porMoeda[m]=(porMoeda[m]||0)+f.valor;}
      const txt=Object.entries(porMoeda).map(([m,v])=>`${m} ${fmt(v)}`).join(" + ");

  if(pairs.length&&!Object.values(bad).some(b=>b.length)) pass(`${pairs.length} itens conferidos`);

  const resumo={crit:A.filter(a=>a.nivel==="crit").length,warn:A.filter(a=>a.nivel==="warn").length,info:A.filter(a=>a.nivel==="info").length,ok:ok.length,itens:iS.length,itensOk:rows.filter(r=>!r.flags.length).length};
  return {achados:A,ok,itens:rows,resumo};
}

// Mantém status (corrigido/justificado) de uma conferência anterior
function mesclarAchados(novos,antigos,quem){
  const old=Object.fromEntries((antigos||[]).map(a=>[a.id,a]));
  const now=Date.now();const out=[];
  for(const a of novos){
    const o=old[a.id];
    if(o&&o.status==="justificado") out.push({...a,status:"justificado",just:o.just,por:o.por,em:o.em});
    else if(o&&o.status==="corrigido") out.push({...a,status:"aberto",reaberto:true,nota:"Marcado como corrigido, mas continua na nova versão do Sigraweb."});
    else out.push({...a,status:"aberto"});
  }
  for(const o of antigos||[]) if(!novos.some(n=>n.id===o.id)&&o.status!=="resolvido") out.push({...o,status:"resolvido",por:quem,em:now,nota:"Não aparece mais na nova versão."});
  return out;
}

function ncmSP(q){q=String(q).replace(/\D/g,"");const out=[];
  for(const r of NCMDATA){const m=new Set(),amplo=[];
    for(const n of r.n){const d=n.replace(/\D/g,"");if(q.startsWith(d)||d.startsWith(q)){m.add(n);if(d.length<q.length)amplo.push(n);}}
    if(!m.size)continue;
    const si=SECS_SP.findIndex(s=>r.f===s.f&&r.a.startsWith(s.a));const s=SECS_SP[si];
    out.push({si,sec:s?s.t:r.f,ef:s?s.ef:"",item:r.i,d:r.d,g:r.g,anexo:r.a,n:r.n,m,amplo});}
  return out;}

const writeQ={};
async function salvarDoc(path,data){
  if(!ST.db){return;}
  const prev=writeQ[path]||Promise.resolve();
  const p=prev.catch(()=>{}).then(()=>ST.db.doc(path).set(JSON.parse(JSON.stringify(data))));
  writeQ[path]=p;
  try{await p;}catch(e){
    if(e&&e.code==="invalid_argument"){ST.canWrite=false;toast("Você não tem permissão para salvar alterações nesta base.");}
    else if(e&&e.code==="quota_exceeded") toast("A base do Crivo está cheia. Avise o administrador.");
    else toast("Não foi possível salvar agora. Tente de novo em instantes.");
    throw e;
  }
}

function promptExtracao(tipo,texto,nomeArq){
  return `Você é um analista de importação brasileiro conferindo documentos de instrução de despacho antes do registro da DUIMP.

${SCHEMA_TXT}

Regras:
- Não invente. Campo ausente = null (ou [] para listas). "tipo" = "${tipo}".
- Números como número JSON com ponto decimal (205973.25), sem separador de milhar. Atenção ao padrão europeu "1.922,00" = 1922.00.
- Pesos SEMPRE em kg (converta toneladas: 1,922 TO = 1922 kg). Quantidade e unidade dos itens como no documento.
- "ncm": só preencha se o documento rotular explicitamente como NCM (formato 0000.00.00). Códigos CN/HS europeus ou outros vão em "cn_code".
- Países em português (Suécia, Finlândia, China...). "pais_embarque" = país do porto/aeroporto de embarque (deduza do nome do porto se precisar, ex.: Gävle → Suécia).
- BL: "draft" = true se o documento estiver marcado DRAFT/minuta ou com campos XXXX. "fretes_bl" com cada linha de frete/sobretaxa, moeda e se é prepaid ou collect. "volumes" = total de volumes. "embalagem_madeira" = true se citar wooden/madeira/pallet de madeira.
- Invoice: "valor_total" = total da fatura; "valor_fob" e "frete" quando aparecem separados (ex.: FOB Price, Ocean Freight). "declaracao_origem" = texto de declaração de origem/statement on origin/número REX, se existir.
- Itens: uma entrada por linha de item (lote/batch conta como linha). "dimensoes_mm" = [espessura, largura, comprimento] quando houver.
- Certificado de origem: preencha "certificado" (acordo, número, data, emissor, país de origem, critério, NCMs).
- "observacoes": divergências ou alertas que você notar dentro do próprio documento (ex.: CEP diferente, campos em branco).

DOCUMENTO:
"""
${texto.slice(0,60000)}
"""`;
}
async function renderPaginasImagens(bytes,max=4){
  const doc=await openPdf(bytes);const out=[];
  for(let p=1;p<=Math.min(doc.numPages,max);p++){const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext("2d"),canvas:c,viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)));}
  return out;
}
async function extrairDocIA(tipo,arq){
  if(!ST.sample) throw new Error("A leitura por IA não está disponível nesta visualização.");
  const opts={modelTier:"default"};
  let texto=arq.pdf.text||"";
  if(texto.replace(/\s/g,"").length<200){
    const lim=ST.sample.limits?await ST.sample.limits():null;
    if(lim&&lim.images){opts.images=await renderPaginasImagens(arq.bytes);texto="(Documento digitalizado: leia as imagens anexas.)";}
    else throw new Error("Este PDF é digitalizado (sem texto) e a leitura de imagens não está disponível.");
  }
  const r=await ST.sample.json(promptExtracao(tipo,texto,arq.nome),opts);
  if(!r||typeof r!=="object") throw new Error("A IA não devolveu dados legíveis.");
  r.tipo=tipo; r.arquivo=arq.nome; return r;
}

  const prods={};for(const i of sigra.itens){const k=i.codProduto||i.seq;if(!prods[k])prods[k]={produto:k,itens:[],ncm:i.ncm,codInterno:i.codInterno,nome:i.nomeProduto,descricao:i.desc};prods[k].itens.push(i.seq);}
  const prompt=`Você é um conferente aduaneiro brasileiro sênior. Compare a descrição dos produtos digitados na DUIMP (Sigraweb) com os itens da invoice e aponte SOMENTE contradições objetivas que as regras automáticas não pegaram: material, grau/liga, acabamento, modelo, função, NCM incoerente com a descrição (pela TEC), unidade de medida incompatível.
Ignore estes apontamentos já feitos: ${achados.map(a=>a.titulo).join("; ")}.
Não comente formatação nem sinônimos. Se não houver contradição, devolva [].
Responda SOMENTE com JSON: [{"titulo": string curto, "nivel": "crit"|"warn", "itens": [números dos itens DUIMP], "descricao": string (1-2 frases, em português), "sugestao": string|null}]

PRODUTOS NA DUIMP: ${JSON.stringify(Object.values(prods))}
ITENS DA INVOICE: ${JSON.stringify(inv.slice(0,80))}`;
  try{const r=await ST.sample.json(prompt,{modelTier:"default"});return Array.isArray(r)?r.slice(0,8):[];}catch(e){return [];}
}

    try{docs[a.tipo]=await extrairDocIA(a.tipo,a);setStep("doc_"+a.tipo,"done");}
    catch(e){setStep("doc_"+a.tipo,"err",e.message);if(e&&e.code==="not_granted")throw new Error("A leitura por IA foi recusada. Autorize o Crivo a usar o Claude para ler os documentos.");}
  }
  setStep("regras","run");
  const res=rodarMotor(docs,sg.G);
  setStep("regras","done");
  setStep("ia","run");
  aplicarIA(res,await analiseIA(docs,sg.G,res.achados));
  setStep("ia","done");
  const G=sg.G, id=uid(), agora=Date.now();
  const achados=mesclarAchados(res.achados,[],ST.me.id);
  const proc={id,ref:ref||G.ref||"Sem referência",idSigra:G.idInterno||null,cliente:G.empresa||docs.INV?.importador?.nome||"—",cnpj:G.cnpj||null,
    uf:(docs.INV?.importador?.uf||docs.BL?.importador?.uf||"").toUpperCase().slice(0,2)||null,exportador:docs.INV?.exportador?.nome||G.fornecedor?.nome||null,
    criadoPor:ST.me.id,criadoEm:agora,atualizadoEm:agora,versao:1,status:"aberto",docsEnviados:instr.map(a=>({tipo:a.tipo,nome:a.nome})),sigraPdf:G.arquivoPdf,
    achados,ok:res.ok,itens:res.itens,resumo:resumoDe(achados),
    log:[{em:agora,por:ST.me.id,acao:`Conferência criada com ${instr.length} documento(s) e ${G.fontes.join(" + ")} do Sigraweb`}]};
  ST.files[id]={bytes:sg.bytes,nome:G.arquivoPdf,locsOk:true};
  await salvarExtr(id,{docs,sigra:semLoc(G)}).catch(()=>{});
  await salvarProc(proc).catch(()=>{});
  return proc;
}
async function reconferir(proc,arqs){
  const ex=await lerExtr(proc.id)||{docs:{},sigra:null};
  const novosDocs=arqs.filter(a=>["BL","INV","PL","CO"].includes(a.tipo));
  if(!Object.keys(ex.docs||{}).length&&!novosDocs.length) throw new Error("Os dados lidos dos documentos deste processo não estão na base. Envie junto o BL, a invoice e o packing list.");
  for(const a of novosDocs){toast(`Lendo ${TIPOS[a.tipo]} com IA…`);ex.docs[a.tipo]=await extrairDocIA(a.tipo,a);}
  const sg=montarSigra(arqs);
  let G=ex.sigra; if(sg){G=sg.G;ST.files[proc.id]={bytes:sg.bytes,nome:G.arquivoPdf,locsOk:true};}
  if(!G) throw new Error("Envie o PDF do Sigraweb para reconferir.");
  const res=rodarMotor(ex.docs,G);
  aplicarIA(res,await analiseIA(ex.docs,G,res.achados));
  const ach=mesclarAchados(res.achados,proc.achados,ST.me.id);
  const agora=Date.now();
  Object.assign(proc,{achados:ach,ok:res.ok,itens:res.itens,resumo:resumoDe(ach),versao:(proc.versao||1)+1,status:proc.status==="liberado"?"aberto":proc.status,
    docsEnviados:[...(proc.docsEnviados||[]).filter(d=>!novosDocs.some(n=>n.tipo===d.tipo)),...novosDocs.map(a=>({tipo:a.tipo,nome:a.nome}))],sigraPdf:sg?G.arquivoPdf:proc.sigraPdf});
  proc.log=[...(proc.log||[]),{em:agora,por:ST.me.id,acao:`Reconferência v${proc.versao}: ${[sg?"novo PDF do Sigraweb":"",...novosDocs.map(a=>TIPOS[a.tipo])].filter(Boolean).join(", ")}`}];
  await salvarExtr(proc.id,{docs:ex.docs,sigra:semLoc(G)}).catch(()=>{});
  await salvarProc(proc);
  return proc;
}

// ---------- PDF anotado (pdf-lib)
const winAnsi=s=>String(s??"").replace(/[×]/g,"x").replace(/[≠]/g,"<>").replace(/[→]/g,"->").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[^\x20-\x7E\xA0-\xFF—–·•]/g,"");
function wrap(txt,font,size,maxW){const words=winAnsi(txt).split(/\s+/);const lines=[];let cur="";for(const w of words){const t=cur?cur+" "+w:w;if(font.widthOfTextAtSize(t,size)>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
async function gerarPdfAnotado(proc){
  const f=ST.files[proc.id]; if(!f) throw new Error("Envie de novo o PDF do Sigraweb para gerar o PDF anotado.");
  const L=window.PDFLib; if(!L) throw new Error("O gerador de PDF não carregou.");
  const pdf=await L.PDFDocument.load(f.bytes.slice(0));
  const font=await pdf.embedFont(L.StandardFonts.Helvetica), bold=await pdf.embedFont(L.StandardFonts.HelveticaBold);
  const cor={crit:L.rgb(0.86,0.16,0.24),warn:L.rgb(0.85,0.55,0.05),info:L.rgb(0.2,0.42,0.85)};
  const abertos=abertosOrd(proc);
  const pages=pdf.getPages();
  abertos.forEach((a,k)=>{
    const n=String(k+1);
    for(const lc of a.locs||[]){const pg=pages[lc.p];if(!pg)continue;
      pg.drawRectangle({x:lc.x-3,y:lc.y-2,width:lc.w+6,height:lc.h+4,borderColor:cor[a.nivel],borderWidth:1.4,color:cor[a.nivel],opacity:0.12,borderOpacity:0.95});
      const bx=Math.max(4,lc.x-20);pg.drawCircle({x:bx+7,y:lc.y+lc.h/2,size:7.5,color:cor[a.nivel]});
      pg.drawText(n,{x:bx+7-font.widthOfTextAtSize(n,7.5)/2,y:lc.y+lc.h/2-2.7,size:7.5,font:bold,color:L.rgb(1,1,1)});
    }
  });
  // página de resumo no início
  const [w,h]=[595.28,841.89]; let pg=pdf.insertPage(0,[w,h]); let y=h-56; const M=46;
  const nova=()=>{pg=pdf.insertPage(pdf.getPages().indexOf(pg)+1,[w,h]);y=h-56;};
  pg.drawText("Crivo · Conferência pré-DUIMP",{x:M,y,size:18,font:bold,color:L.rgb(0.16,0.13,0.4)});y-=22;
  pg.drawText(winAnsi(`${proc.ref} · ${proc.cliente}`),{x:M,y,size:11,font});y-=15;
  pg.drawText(winAnsi(`Gerado em ${dataBR(Date.now())} por ${nome(ST.me.id)} · versão ${proc.versao||1}`),{x:M,y,size:9,font,color:L.rgb(0.4,0.4,0.45)});y-=22;
  const r=proc.resumo;pg.drawText(winAnsi(`${r.crit} crítico(s) · ${r.warn} atenção · ${r.info} informativo(s) em aberto`),{x:M,y,size:11,font:bold,color:r.crit?cor.crit:L.rgb(0.1,0.5,0.3)});y-=24;
  abertos.forEach((a,k)=>{
    const head=`${k+1}. [${NIVEL_LABEL[a.nivel]}] ${a.titulo}`;const body=wrap(a.descricao,font,9.5,w-2*M-14);const extra=(a.sugestao?["Sugestão: "+a.sugestao]:[]).flatMap(s=>wrap(s,font,9.5,w-2*M-14));
    const need=16+12*(body.length+extra.length)+10; if(y-need<50) nova();
    pg.drawRectangle({x:M,y:y-need+12,width:3,height:need-8,color:cor[a.nivel]});
    wrap(head,bold,10.5,w-2*M-14).forEach(t=>{pg.drawText(t,{x:M+12,y,size:10.5,font:bold});y-=14;});
    body.forEach(t=>{pg.drawText(t,{x:M+12,y,size:9.5,font,color:L.rgb(0.2,0.2,0.25)});y-=12;});
    extra.forEach(t=>{pg.drawText(t,{x:M+12,y,size:9.5,font,color:L.rgb(0.3,0.25,0.6)});y-=12;});
    y-=10;
  });
  if(!abertos.length){pg.drawText("Nenhum apontamento em aberto.",{x:M,y,size:11,font});}
  return await pdf.save();
}

    <div class="files" id="nList"></div>

   </div></section>
  </div></div>`;

function passosHtml(st={}){const P=[["sigra","Ler o PDF do Sigraweb"],["doc_BL","Ler o conhecimento de embarque"],["doc_INV","Ler a invoice"],["doc_PL","Ler o packing list"],["doc_CO","Ler o certificado de origem"],["regras","Cruzar documentos × processo"],["ia","Revisão de descrições pela IA"]];
  return P.map(([k,t])=>{const s=st[k]||{};return `<div class="step ${s.s||""}" data-step="${k}"><i></i><span>${t}${s.m?` · <span class="bad">${esc(s.m)}</span>`:""}</span></div>`;}).join("");}
function montarNova(){
  ST.draft=ST.draft||{arqs:[]};
  const drop=$("#drop"),inp=$("#nFiles");
  const lista=()=>{
    const tem=t=>ST.draft.arqs.some(a=>t.includes(a.tipo));
    $("#nCheck").innerHTML=[["BL",["BL"]],["Invoice",["INV"]],["Packing",["PL"]],["C. origem",["CO"]],["Sigraweb",["SIGRA_DUIMP","SIGRA_DET"]]].map(([t,k])=>`<span class="${tem(k)?"ok":""}">${t}</span>`).join("");
    $("#nList").innerHTML=ST.draft.arqs.map((a,k)=>`<div class="file"><span class="tag ${a.tipo?"":"no"}">${a.tipo?(CURTO[a.tipo]||"Sigraweb"):"?"}</span><span class="nm" title="${esc(a.nome)}">${esc(a.nome)}</span><select data-k="${k}" aria-label="Tipo do documento">${Object.entries(TIPOS).map(([v,t])=>`<option value="${v}" ${a.tipo===v?"selected":""}>${t}</option>`).join("")}<option value="" ${!a.tipo?"selected":""}>Não identificado</option></select><button class="btn sm ghost" data-rm="${k}" aria-label="Remover ${esc(a.nome)}">Remover</button></div>`).join("");
    const sg=ST.draft.arqs.find(a=>a.tipo==="SIGRA_DUIMP"||a.tipo==="SIGRA_DET");
    if(sg&&!$("#nRef").value){try{const S=sg.tipo==="SIGRA_DUIMP"?parseSigraDuimp(sg.pdf):parseSigraDet(sg.pdf);if(S.ref)$("#nRef").value=S.ref;}catch(e){}}};
  const add=async files=>{$("#nMsg").textContent="Lendo arquivos…";for(const f of files){if(!/pdf$/i.test(f.name)&&f.type!=="application/pdf"){toast(`${f.name} não é PDF.`);continue;}try{ST.draft.arqs.push(await lerArquivo(f));}catch(e){toast(`Não consegui abrir ${f.name}.`);}}$("#nMsg").textContent="";lista();};
  inp.onchange=()=>{add([...inp.files]);inp.value="";};
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>add([...e.dataTransfer.files]));
  $("#nList").addEventListener("change",e=>{const s=e.target.closest("select[data-k]");if(s){ST.draft.arqs[+s.dataset.k].tipo=s.value||null;lista();}});
  $("#nList").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){ST.draft.arqs.splice(+b.dataset.rm,1);lista();}});
  $("#nGo").onclick=async()=>{
    const arqs=ST.draft.arqs;
    if(!arqs.some(a=>a.tipo==="SIGRA_DUIMP"||a.tipo==="SIGRA_DET")){$("#nMsg").innerHTML='<span class="bad">Falta o PDF da Conferência DUIMP ou Detalhada do Sigraweb.</span>';return;}
    if(!arqs.some(a=>["BL","INV","PL","CO"].includes(a.tipo))){$("#nMsg").innerHTML='<span class="bad">Envie pelo menos um documento de instrução (BL, invoice ou packing).</span>';return;}
    $("#nGo").setAttribute("aria-disabled","true");$("#nMsg").textContent="Conferindo…";
    const st={};const set=(k,s,m)=>{st[k]={s,m};$("#nSteps .steps").innerHTML=passosHtml(st);};
    for(const k of ["doc_BL","doc_INV","doc_PL","doc_CO"]) if(!arqs.some(a=>"doc_"+a.tipo===k)) st[k]={s:"",m:"não enviado"};
    $("#nSteps .steps").innerHTML=passosHtml(st);
    try{const p=await executarConferencia(arqs,$("#nRef").value.trim(),set);ST.draft=null;ir("p-"+p.id);}
    catch(e){$("#nMsg").innerHTML=`<span class="bad">${esc(e.message||"Não foi possível conferir.")}</span>`;$("#nGo").removeAttribute("aria-disabled");}
  };
  lista();
}

// ---------- Processo
function valsHtml(vs){return vs&&vs.length?`<div class="vals">${vs.map(v=>`<div class="val ${v.diff?"diff":""} ${v.miss&&!v.diff?"miss":""}"><div class="k">${esc(v.k)}</div><div class="v">${esc(v.v)}</div></div>`).join("")}</div>`:"";}
function findHtml(a,k,proc){
  const done=a.status!=="aberto";
  const alvo=ST.fItem&&(a.itens||[]).includes(ST.fItem);
  const open=!!ST.abertos[a.id]||alvo;
  const st=a.status==="justificado"?`<span class="pill neutral">Justificado</span>`:a.status==="corrigido"?`<span class="pill ok">Corrigido</span>`:a.status==="resolvido"?`<span class="pill ok">Resolvido</span>`:`<span class="pill ${a.nivel}">${NIVEL_LABEL[a.nivel]}</span>`;
  return `<article class="find ${a.nivel} ${done?"done":""} ${open?"open":""} ${alvo?"alvo":""}" id="f-${esc(a.id)}" data-fid="${esc(a.id)}" tabindex="-1">
   <div class="hd" data-toggle="${esc(a.id)}" role="button" aria-expanded="${open}" tabindex="0"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true">${ICON.chevr}</svg>${!done?`<span class="num">#${k}</span>`:""}<span class="grp">${esc(a.grupo)}</span>${a.origem==="IA"?'<span class="ia">IA · confirme</span>':""}<h3>${esc(a.titulo)}</h3>${alvo?`<span class="item-tag">Item ${ST.fItem}</span>`:""}${a.itens&&a.itens.length?`<span class="muted mono" style="font-size:12px">${a.itens.length} ite${a.itens.length>1?"ns":"m"}</span>`:""}${st}</div>
   <div class="resumo">${esc(a.descricao)}</div>
   <div class="bd">
   <p>${esc(a.descricao)}</p>${a.nota?`<p class="muted" style="font-size:12.5px">${esc(a.nota)}</p>`:""}
   ${valsHtml(a.valores)}
   ${a.linhas&&a.linhas.length?`<details ${alvo?"open":""}><summary>${a.linhas.length} linha(s) de detalhe</summary><ul>${a.linhas.map(l=>{const hit=alvo&&new RegExp("^Ite(m|ns) "+ST.fItem+"(\\D|$)").test(l);return `<li class="${hit?"hit":""}">${esc(l)}${hit?' <b class="seta-hit">← este item</b>':""}</li>`;}).join("")}</ul></details>`:""}
   ${a.sugestao?`<div class="sug">Sugestão: ${esc(a.sugestao)}</div>`:""}
   ${a.just?`<div class="just"><b>Justificativa:</b> ${esc(a.just)}</div>`:""}
   <div class="ft">${!done&&ST.canWrite?`<button class="btn sm" data-act="corrigir" data-id="${esc(a.id)}" title="Atalho: C">Marcar como corrigido</button><button class="btn sm ghost" data-act="justificar" data-id="${esc(a.id)}">Justificar</button>`:""}
   ${done&&ST.canWrite?`<button class="btn sm ghost" data-act="reabrir" data-id="${esc(a.id)}">Reabrir</button>`:""}
   ${a.locs&&a.locs.length?`<button class="btn sm ghost" data-act="ver" data-id="${esc(a.id)}">${ic("pdf")}Ver no PDF</button>`:""}
   ${a.por&&done?`<span class="who">${esc(nome(a.por))} · ${dataBR(a.em)}</span>`:""}</div></div></article>`;
}
function progHtml(p){
  const t=(p.achados||[]).filter(a=>a.nivel!=="info").length||1, res=(p.achados||[]).filter(a=>a.nivel!=="info"&&a.status!=="aberto").length;
  const r=p.resumo||{};const pct=Math.round(res/t*100);
  return `<div class="prog" title="Apontamentos críticos e de atenção tratados"><div class="t"><span>Conferência tratada</span><b>${pct}%</b></div><div class="track"><i class="ok" style="width:${res/t*100}%"></i><i class="warn" style="width:${(r.warn||0)/t*100}%"></i><i class="crit" style="width:${(r.crit||0)/t*100}%"></i></div><div class="t"><span>${res} de ${t} tratados</span><span>${r.crit||0} crítico(s) em aberto</span></div></div>`;
}

   <div id="tabBody">${tabBody(p)}</div></div>`;

function tabBody(p){
  if(ST.tab==="apontamentos"){

      <select id="fGrupo" aria-label="Grupo"><option value="todos">Todos os grupos</option>${grupos.map(g=>`<option ${ST.fGrupo===g?"selected":""}>${esc(g)}</option>`).join("")}</select>
      <div class="sp"></div><span class="muted" style="font-size:12px"><span class="kbd">J</span> <span class="kbd">K</span> navegar · <span class="kbd">Enter</span> abrir · <span class="kbd">C</span> corrigido</span>
      <button class="btn sm ghost" data-act="expandir">Expandir tudo</button><button class="btn sm ghost" data-act="recolher">Recolher</button></div>
    ${ab.length?`<div class="finds">${ab.map(a=>findHtml(a,num[a.id],p)).join("")}</div>`:`<div class="card empty">${todos.length?"Nenhum apontamento com esse filtro.":"Nenhum apontamento em aberto. O processo pode ser liberado."}</div>`}
    ${(p.ok||[]).length?`<section class="card" id="okList" style="margin-top:18px"><header><h2>Verificações aprovadas</h2><span class="muted" style="font-size:12.5px">${p.ok.length}</span></header><div class="body chips">${p.ok.map(o=>`<span class="chip"><i class="ok"></i>${esc(o)}</span>`).join("")}</div></section>`:""}

async function renderViewer(p,focoId){
  const f=ST.files[p.id];const box=$("#viewer");if(!f||!box)return;

    const doc=await openPdf(f.bytes);if(tk!==viewerToken)return;
    const abertos=abertosOrd(p);
    const porPag={};abertos.forEach((a,k)=>(a.locs||[]).forEach(l=>{if(l&&l.p<doc.numPages)(porPag[l.p]=porPag[l.p]||[]).push({a,k:k+1,l});}));
    const pags=Object.keys(porPag).map(Number).sort((a,b)=>a-b);
    const mostrar=pags.length?pags:[0];
    box.innerHTML=`<div class="muted" style="align-self:flex-start;font-size:12.5px">Mostrando ${mostrar.length} página(s) com marcações de ${doc.numPages}.</div>`;
    const W=Math.min(860,box.clientWidth-40);
    for(const pi of mostrar){
      const pg=await doc.getPage(pi+1);if(tk!==viewerToken)return;
      const vp1=pg.getViewport({scale:1});const sc=W/vp1.width;const vp=pg.getViewport({scale:sc*(window.devicePixelRatio||1)});

      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=W+"px";c.style.height=vp1.height*sc+"px";wrapEl.appendChild(c);
      const lbl=document.createElement("div");lbl.className="muted";lbl.style.cssText="align-self:flex-start;font-size:12px";lbl.textContent="Página "+(pi+1);box.appendChild(lbl);box.appendChild(wrapEl);
      await pg.render({canvasContext:c.getContext("2d"),canvas:c,viewport:vp}).promise;
      for(const m of porPag[pi]||[]){const d=document.createElement("div");d.className="mk "+m.a.nivel;d.dataset.id=m.a.id;
        d.style.left=(m.l.x-3)*sc+"px";d.style.top=(vp1.height-m.l.y-m.l.h-2)*sc+"px";d.style.width=(m.l.w+6)*sc+"px";d.style.height=(m.l.h+4)*sc+"px";

}

  if(e.key==="Escape"){const s=document.querySelector(".scrim");if(s)s.remove();return;}
  if(digitando||e.metaKey||e.ctrlKey||e.altKey||document.querySelector(".scrim"))return;
  if(e.key==="/"){e.preventDefault();if(rota().v!=="conferencias")ir("conferencias");setTimeout(()=>{const f=$("#fq");if(f)f.focus();},60);return;}
  if(rota().v!=="proc"||ST.tab!=="apontamentos")return;
  if(e.key==="j"||e.key==="ArrowDown"&&e.target.closest&&e.target.closest(".find")){e.preventDefault();focarFind(1);}
  else if(e.key==="k"||e.key==="ArrowUp"&&e.target.closest&&e.target.closest(".find")){e.preventDefault();focarFind(-1);}
  else if(e.key==="Enter"){const f=document.querySelector(".find.foco")||e.target.closest&&e.target.closest(".find");if(f){e.preventDefault();const id=f.dataset.fid;ST.abertos[id]=!ST.abertos[id];f.classList.toggle("open",ST.abertos[id]);}}

// ---------- inicialização
async function iniciar(){
  try{if(localStorage.getItem("crivo.col")==="1")$(".app").classList.add("collapsed");}catch(e){}
  let tema="claro";try{tema=localStorage.getItem("crivo.tema")||"claro";}catch(e){}aplicarTema(tema);
  if(typeof CRIVO_DEMO!=="undefined"&&CRIVO_DEMO) return demoIniciar();
  render();
  if(!window.claude||!window.claude.use){ST.local=true;ST.procsLoaded=true;render();return;}
  const [db,user,sample,downloads]=await Promise.all(["db","user","sample","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  Object.assign(ST,{db,user,sample,downloads});
  if(user){try{ST.owner=!!(await user.isOwner());}catch(e){}try{ST.me.id=await user.id();}catch(e){}try{const me=await user.me();if(me){ST.me.id=ST.me.id||me.id;ST.me.name=me.name||"";if(me.name)ST.names[me.id]=me.name;}}catch(e){}
    try{const c=await user.can("data.write");if(c===false)ST.canWrite=false;}catch(e){}}
  if(!db){ST.local=true;ST.procsLoaded=true;render();return;}
  const tm=setTimeout(()=>{ST.loadTimeout=true;render();},10000);
  db.collection("processos").orderBy("atualizadoEm","desc").limit(500).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(tm);ST.loadTimeout=false;}
    ST.procs=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id}));ST.procsLoaded=true;
    const r=rota();
    if(document.activeElement&&/^(fq|ufq|ncmq|jTxt|uBusca|tolPeso|tolValor|nRef|itQ|guiaQ)$/.test(document.activeElement.id))return;
    if(document.querySelector(".scrim"))return;
    if(r.v==="nova"||r.v==="guia")return;
    if(r.v==="proc"&&ST.tab==="documento"&&$("#viewer .pg")){shell();return;}
    render();
  },err=>{clearTimeout(tm);ST.procsLoaded=true;if(err&&err.code==="revoked"){ST.local=true;}render();});
  db.doc("config/icmsUF").onSnapshot(s=>{if(s.exists){const d=s.data();if(d&&Array.isArray(d.linhas)&&d.linhas.length){ST.cfg.icms=JSON.parse(JSON.stringify(d));const r=rota().v;if(r==="icms-uf")render();}}},()=>{});
  db.doc("config/regras").onSnapshot(s=>{if(s.exists)ST.cfg.regras={niveis:{},tolPeso:0,tolValor:0.01,...JSON.parse(JSON.stringify(s.data()))};},()=>{});
  db.doc("config/usuarios").onSnapshot(s=>{if(s.exists){ST.cfg.papeis=JSON.parse(JSON.stringify(s.data().papeis||{}));ST.papel=ST.owner?"admin":(ST.cfg.papeis[ST.me.id]||"operacional");shell();}},()=>{});
  if(ST.owner)ST.papel="admin";
  render();
}
iniciar();
